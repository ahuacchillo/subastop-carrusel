<!doctype html>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio · VMC Subastas</title>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Plus Jakarta Sans — the typeface of the VOYAGER system. The tool speaks in
   the same voice as the pieces it produces. Served locally, never from a CDN.
   ═══════════════════════════════════════════════════════════════════════════ */
@font-face {
  font-family: "Jakarta";
  src: url("/fuente") format("woff2");
  font-weight: 400 800;
  font-display: swap;
}

:root {
  color-scheme: dark;

  /* Dark with a violet cast rather than gray: the surround must not skew how
     the car photo's own color reads, since that is what is being judged. */
  --bg:        #0E0B14;
  --panel:     #151020;
  --raised:    #1C1529;
  --raised-2:  #241B35;
  --line:      #2A2038;
  --line-soft: #211930;

  --ink:   #EDE9F5;
  --ink-2: #9A90B4;          /* 6:1 on --panel */

  --violet:   #8460E5;
  --violet-2: #AE8EFF;
  --orange:   #ED8936;       /* reserved: the cover badge, nothing else */
  --green:    #4ADE9B;
  --red:      #F87171;
  /* Voyager: cyan es NEGOCIABLE, y los dos gradientes canonicos del sistema.
     Son los mismos que la pagina de ofertas de estudio.py: se mueven juntos.
     #00A8AB/#00CACE es el valor exacto de Concorde (cyan-700/600 en
     DESIGN.md) -- se habian "corregido" antes contra un registry online que
     en ese momento servia un valor viejo bajo el mismo nombre de token. */
  --cyan:     #00A8AB;
  --cyan-2:   #00CACE;
  --vy-primary: linear-gradient(149.88deg,#ED8936 0%,#ED8936 40%,#8460E5 100%);
  --vy-borde:   linear-gradient(135deg,#FFFFFF 0%,#F4AC59 22%,#8460E5 74.5%,#FFFFFF 100%);

  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s7: 32px;

  --r2: 8px; --r3: 12px; --r4: 16px; --r-pill: 9999px;

  --shadow:  0 8px 24px -10px rgba(0,0,0,.75);
  --lift:    0 18px 44px -18px rgba(0,0,0,.9);
  --ease:    cubic-bezier(.16,1,.3,1);

  /* Glass. The surfaces are sheets over the violet wash on <body>, so depth
     comes from what shows through them rather than from another border. The
     alphas are picked so the sheet lands on the same luminance as the solid
     token it replaces — the contrast of the text on top does not move.

       --sheet    the rails and the topbar: structural, most opaque
       --raise    a control resting on a sheet
       --raise-2  the same control under the cursor
       --edge     the specular hairline along a lit top edge
       --frost    the blur itself; saturate() keeps the violet from going gray

     La hoja se oscurecio hasta quedar por debajo del escenario. Antes rails y
     escenario caian en la misma luminancia y el ojo no tenia donde posarse: la
     herramienta existe para mirar las slides, y las slides competian con los
     paneles que las rodean. Ahora los paneles son la sala a oscuras. */
  --sheet:   rgba(13, 9, 21, .78);
  --raise:   rgba(38, 29, 56, .58);
  --raise-2: rgba(52, 40, 76, .74);
  /* Subieron con la hoja: estos dos numeros estaban calibrados contra un
     --sheet mas claro, y al oscurecerlo el filete dejo de leerse. Un boton sin
     canto no se ve como una tecla, se ve como texto flotando. */
  --edge:    rgba(255, 255, 255, .11);
  --edge-2:  rgba(255, 255, 255, .20);
  --frost:   saturate(155%) blur(20px);

  /* La barra de scroll es del navegador, pero se ve dentro de la hoja: por
     defecto entra en gris claro del sistema y es lo unico en pantalla que no
     esta en la paleta. Va en el mismo violeta, translucida sobre riel vacio. */
  --scroll:    rgba(174, 142, 255, .20);
  --scroll-2:  rgba(174, 142, 255, .40);
}

* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }

html, body { height: 100%; }
body {
  /* Pools of brand light in the background itself, not in a ::before with a
     negative z-index — that paints *behind* the body background and the wash
     never shows. They sit under the rails on purpose: that is where the glass
     has to read. The stage keeps its own dimmer pool, because the car photo is
     what is being judged and nothing may skew how its color looks. */
  background:
    radial-gradient(560px 760px at 3%  22%,  rgba(132, 96, 229, .30), transparent 70%),
    radial-gradient(520px 720px at 99% 30%,  rgba(174, 142, 255, .22), transparent 70%),
    radial-gradient(680px 520px at 96% 104%, rgba(132, 96, 229, .20), transparent 68%),
    radial-gradient(620px 420px at 8% 102%,  rgba(174, 142, 255, .12), transparent 70%),
    var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 "Jakarta", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;              /* one view: the page itself never scrolls */
}

::selection { background: var(--violet); color: #fff; }
:focus-visible { outline: 2px solid var(--violet-2); outline-offset: 2px; border-radius: var(--r2); }

/* Una sola vez para toda la pagina: los tres sitios que scrollean —el rail
   derecho, el de fotos y el caption— llevaban tres reglas distintas, y dos de
   ellas eran ninguna. Sin `::-webkit-scrollbar`: Chrome lo ignora en cuanto ve
   las propiedades estandar, asi que ahi seria un bloque que no corre nunca. */
* { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
/* Se aclara con el puntero dentro del panel, no solo encima de la barra: a 6px
   de ancho, apuntarle antes de verla es el orden equivocado. */
.rail:hover, .rail-body:hover, textarea:hover { scrollbar-color: var(--scroll-2) transparent; }

.rail-body { overflow-y: auto; overscroll-behavior: contain; }

/* ── Frame ────────────────────────────────────────────────────────────────── */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

.topbar {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: var(--s5);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--edge);
  background: var(--sheet);
  backdrop-filter: var(--frost); -webkit-backdrop-filter: var(--frost);
  box-shadow: inset 0 1px 0 var(--edge-2), 0 12px 32px -24px #000;
}

/* Indeterminate sweep while the render runs — the one place a wait is long
   enough that a static label reads as a freeze. It loops on purpose: the
   render is a subprocess with no progress to report, and every honest
   indeterminate indicator loops. It only exists while `body.busy`. */
.topbar::after {
  content: ""; position: absolute; inset-inline: 0; inset-block-end: -1px;
  height: 2px; background: linear-gradient(90deg, transparent, var(--violet-2), transparent);
  transform: translateX(-100%); opacity: 0;
}
body.busy .topbar::after { opacity: 1; animation: sweep 1.1s linear infinite; }
@keyframes sweep { to { transform: translateX(100%); } }

.brand { display: flex; align-items: baseline; gap: var(--s2); flex: none; }
.brand b {
  font-weight: 800; font-size: 20px; letter-spacing: -.03em;
  /* The one flourish on the chrome: the same violet the pieces are built in. */
  background: linear-gradient(100deg, var(--ink) 18%, var(--violet-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand span { color: var(--ink-2); font-size: 13px; }

/* El filete separa la identidad del trabajo. Es el mismo recurso que ya usaba
   .deliver para separar construir de entregar: sin el, la barra era una fila
   corrida donde la marca y el primer control se leian como un solo bloque. */
.lookup { display: flex; align-items: center; gap: var(--s2); flex: none;
          padding-inline-start: var(--s5);
          border-inline-start: 1px solid var(--edge); }
.lookup input { width: 250px; }

/* Se queda con el hueco que sobra y se corta solo cuando de verdad no cabe.
   Con `title` puesto desde say(): un mensaje cortado a mitad no informa, y este
   es el unico sitio donde la herramienta dice si algo fallo. */
.status {
  flex: 1 1 auto; min-width: 6ch; color: var(--ink-2); font-size: 13px;
  line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.status.ok   { color: var(--green); }
.status.bad  { color: var(--red); }
.status.busy { color: var(--violet-2); }

/* Photos · stage · details. The stage leads. */
.board { display: grid; grid-template-columns: 268px minmax(0, 1fr) 296px; min-height: 0; }

.rail {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--sheet);
  backdrop-filter: var(--frost); -webkit-backdrop-filter: var(--frost);
}
.rail.left  { border-right: 1px solid var(--edge);
              box-shadow: inset 0 1px 0 var(--edge-2), inset -1px 0 0 var(--edge); }
.rail.right { border-left:  1px solid var(--edge);
              box-shadow: inset 0 1px 0 var(--edge-2), inset  1px 0 0 var(--edge); }

.rail-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s2); padding: var(--s4) var(--s4) var(--s2);
}
/* El titulo de un rail y la etiqueta de un campo eran la misma cosa: 11px, en
   caps, en --ink-2. Un rail entero se leia como un muro de mayusculas sin
   principio. El titulo sube a --ink y abre el interletrado; la etiqueta se
   queda donde estaba, y con eso hay dos escalones donde habia uno. */
.rail-head h2 {
  font-size: 12px; font-weight: 800; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink);
}
.rail-body { flex: 1; padding: var(--s2) var(--s4) var(--s5); }

/* El rail derecho no scrollea: reparte. Los datos y los dos encabezados toman
   su alto natural —por eso Starting price no vuelve a quedar cortado a media
   fila, que fue lo que rompio el primer intento de repartir— y el caption se
   queda con lo que sobre. Antes el rail entero scrolleaba y el textarea
   scrolleaba dentro: dos barras verticales en la misma columna, y la de fuera
   existia por 77px.

   El `min-height: 0` es lo que faltaba entonces: sin el, un hijo flex se niega
   a encogerse por debajo de su contenido y desborda el rail en vez de repartir.

   `overflow-y: auto` se queda de ultimo recurso: si la ventana es tan baja que
   ni con el piso del textarea cabe, vuelve a scrollear. */
.rail.right { overflow-y: auto; overscroll-behavior: contain; }
.rail.right .rail-head { flex: none; }
.rail.right .rail-body { flex: none; overflow: visible; }
.rail.right .copy-body { flex: 1; min-height: 0; }
/* 96px son unas cinco lineas del monoespaciado: lo justo para leer el gancho,
   que es lo que se revisa antes de publicar. Por debajo de eso el rail vuelve a
   scrollear, porque encoger mas no deja nada legible. */
.rail.right .copy-body textarea { flex: 1; min-height: 96px; }

/* The caption shares the rail with the details, under its own heading: it
   belongs next to the slides, and it only shows once there is a carousel. */
.copy-head { border-block-start: 1px solid var(--edge); padding-block-start: var(--s4);
             justify-content: flex-start; }
.copy-head .cap-count { margin-inline-start: auto; }
/* Solo-icono, no un CTA: mismo trato que .tabs button. */
.capgrow { padding: 4px 7px; border-radius: var(--r2); }
.capgrow .shrink { display: none; }

/* Abierto: el caption se queda con el rail entero. Los datos no se van a
   ningun sitio —vuelven al cerrar—, y con el flex de arriba el textarea toma
   el hueco sin que haga falta darle una altura. */
.rail.right.solo-caption > .rail-head:first-child,
.rail.right.solo-caption > .fields { display: none; }
.rail.right.solo-caption .copy-head { border-block-start: 0; }
.rail.right.solo-caption .capgrow .grow { display: none; }
.rail.right.solo-caption .capgrow .shrink { display: inline; }
.copy-state { font-size: 12px; color: var(--ink-2); }
.copy-body { display: flex; flex-direction: column; gap: var(--s2);
             padding: 0 var(--s4) var(--s5); }
.copy-body .copy-actions { flex: none; }
.copy-body textarea {
  /* `resize` fuera: el textarea ya ocupa todo el hueco que hay, asi que
     arrastrarlo no tenia a donde crecer. Un tirador que no hace nada. */
  width: 100%; min-height: 34vh; resize: none; padding: var(--s3);
  background: var(--raise); border: 1px solid var(--edge);
  border-radius: var(--r3); color: var(--ink);
  box-shadow: inset 0 1px 0 var(--edge), inset 0 10px 22px -18px #000;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font: 400 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  transition: border-color .15s, box-shadow .15s;
}
.copy-body textarea:hover { border-color: var(--edge-2); }
.copy-body textarea:focus { border-color: var(--violet); outline: none;
  box-shadow: inset 0 1px 0 var(--edge-2), 0 0 0 3px rgba(132,96,229,.16); }
.copy-actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
/* Full row: with the three buttons on the same line the last one fell off the
   edge of the rail, and the one that fell off was Copy. */
.copy-actions .wrecked {
  flex-basis: 100%;
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none;
}
.copy-actions .wrecked:hover { color: var(--ink); }
.copy-actions .wrecked input { accent-color: var(--violet); }
.copy-actions button { flex: 1; }

/* ── Controls ─────────────────────────────────────────────────────────────── */
input[type=text] {
  width: 100%; padding: 9px var(--s3);
  background: var(--raise); border: 1px solid var(--edge);
  /* Concorde's own Input is radius 16 (DESIGN.md), not the 8px this shared
     with buttons before either was a design-system decision. */
  border-radius: var(--r4); color: var(--ink); font: inherit;
  box-shadow: inset 0 1px 0 var(--edge), inset 0 8px 18px -14px #000;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: border-color .15s, background .15s, box-shadow .15s;
}
input[type=text]:hover { border-color: var(--edge-2); background: var(--raise-2); }
input[type=text]:focus { border-color: var(--violet); background: var(--raise-2);
  box-shadow: inset 0 1px 0 var(--edge-2), 0 0 0 3px rgba(132,96,229,.16); outline: none; }
input[type=text]::placeholder { color: var(--ink-2); }

/* Concorde: "todos los botones son pill" (DESIGN.md) -- este archivo los
   tenia todos en el mismo radio cuadrado que Table (8px). Las excepciones
   reales del catalogo son los controles cuadrados de solo-icono (DocButton,
   radio 4): aca son `.tabs button` y `.capgrow`, que vuelven a --r2 abajo. */
button {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; white-space: nowrap;
  padding: 9px var(--s4); border: 1px solid var(--edge);
  border-radius: var(--r-pill); cursor: pointer;
  font: 600 15px "Jakarta", system-ui, sans-serif; color: var(--ink);
  background: var(--raise);
  box-shadow: inset 0 1px 0 var(--edge-2);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: background .15s, border-color .15s, color .15s,
              box-shadow .15s, transform .1s var(--ease);
}
button:hover:not(:disabled) { background: var(--raise-2); border-color: var(--edge-2); }
/* A press that moves. One pixel is enough to feel like a surface. */
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .38; cursor: not-allowed; }

/* The primary is the one lit body on the page: the same border-gradient CTA
   as every other "build it" button in the product (Ofertas' "Hacer los
   carruseles"). --vy-primary/--vy-borde were already sitting in :root,
   unused, while this button rolled its own plain violet -- the same action
   looked like two different products depending which screen you were on. */
button.primary {
  position: relative; overflow: hidden;
  border: 2px solid transparent; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.25);
  background-image: var(--vy-primary), var(--vy-borde);
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3),
              0 8px 22px -12px rgba(237,137,54,.55),
              0 8px 22px -12px rgba(132,96,229,.7);
}
button.primary::before {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(rgba(255,255,255,.17) 0%, transparent 55%);
}
button.primary:hover:not(:disabled) {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.36),
              0 10px 26px -12px rgba(237,137,54,.7),
              0 10px 26px -12px rgba(132,96,229,.85);
}
button.ghost { background: transparent; border-color: var(--edge); color: var(--ink-2);
               box-shadow: none; }
button.ghost:hover:not(:disabled) { background: var(--raise); color: var(--ink);
               box-shadow: inset 0 1px 0 var(--edge); }
button.small { padding: 6px 10px; font-size: 13px; }

.format-toggle { display: flex; gap: 4px; }
.format-toggle button.on {
  background: linear-gradient(180deg, #9a79f2, var(--violet)); color: #fff;
  border-color: rgba(255,255,255,.18);
}

svg.icon { width: 15px; height: 15px; flex: none; }

/* ── Photos ───────────────────────────────────────────────────────────────── */
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }

.thumb {
  position: relative; aspect-ratio: 1; border-radius: var(--r3);
  overflow: hidden; cursor: pointer; background: var(--raise);
  border: 1px solid var(--edge);
  transition: border-color .15s, box-shadow .2s, transform .2s var(--ease);
}
.thumb:hover { border-color: var(--edge-2); transform: translateY(-2px);
               box-shadow: var(--shadow); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block;
             transition: opacity .2s; }
.thumb:not(.picked) img { opacity: .55; }
.thumb:hover img { opacity: 1; }
.thumb.picked { border-color: var(--violet);
                box-shadow: 0 6px 18px -12px rgba(132,96,229,.9); }
.thumb.current { box-shadow: 0 0 0 2px var(--violet-2); }

.thumb .rank {
  position: absolute; inset-block-start: 6px; inset-inline-start: 6px;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px;
  background: var(--violet); color: #fff;
  display: grid; place-items: center; font: 700 13px "Jakarta", sans-serif;
  box-shadow: 0 2px 8px -2px rgba(0,0,0,.85);
}
.thumb .cover {
  position: absolute; inset-block-end: 0; inset-inline: 0;
  background: var(--orange); color: #fff; padding: 3px;
  font: 700 11px "Jakarta", sans-serif; letter-spacing: .08em; text-align: center;
}

/* Ocupa el rail entero en vez de ser un sello de 97px con 500 de vacio debajo.
   No es solo relleno: el rail completo es la zona donde se sueltan las fotos,
   asi que el area que lo dice tiene que medir lo mismo que el area que lo
   acepta. Cuando llegan las fotos, la galeria se queda con el sitio. */
.rail.left .rail-body { display: flex; flex-direction: column; }
.dropzone {
  flex: 1; display: grid; place-content: center;
  border: 1px dashed var(--edge-2); border-radius: var(--r3);
  background: var(--raise);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: var(--s6) var(--s4); text-align: center;
  color: var(--ink-2); font-size: 13px;
  transition: border-color .15s, color .15s, background .15s;
}
.rail.left.dragging { background: #1a1330; }
.rail.left.dragging .dropzone { border-color: var(--violet); color: var(--ink); }

/* ── Stage ────────────────────────────────────────────────────────────────── */
.stage-col {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  padding: var(--s4) var(--s6) var(--s5);
}

.stage-head { display: flex; align-items: center; gap: var(--s4); padding-block-end: var(--s3); }
.tabs { display: flex; gap: 6px; }
/* Solo-icono/numero, no un CTA: se queda cuadrado, como DocButton. */
.tabs button { width: 34px; height: 34px; padding: 0; font-size: 13px;
               border-radius: var(--r2); }
.tabs button.on {
  background: linear-gradient(180deg, #9a79f2, var(--violet)); color: #fff;
  border-color: rgba(255,255,255,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 6px 16px -10px rgba(132,96,229,.9);
}

.zoombox { display: flex; align-items: center; gap: var(--s2); margin-inline-start: auto; }
.zoombox label { color: var(--ink-2); font-size: 13px; }
.zoombox output { font-variant-numeric: tabular-nums; font-size: 13px;
                  color: var(--ink-2); min-width: 42px; }
input[type=range] { width: 128px; accent-color: var(--violet); }
input[type=range]:disabled { accent-color: var(--line); opacity: .5; }
.zoombox:has(:disabled) label, .zoombox:has(:disabled) output { opacity: .5; }

/* El charco de luz donde se para la pieza. Estaba puesto pero casi apagado —a
   .13 sobre un fondo que ya es violeta no se veia—, asi que el escenario se
   leia tan plano como los rails. Dos capas del mismo violeta: un nucleo corto
   que marca donde cae la pieza, y una falda larga que lo funde con la sala. */
.stage {
  position: relative; display: grid; place-items: center; min-height: 0;
}
.stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(46% 46% at 50% 44%, rgba(174,142,255,.20), transparent 68%),
    radial-gradient(82% 82% at 50% 48%, rgba(132,96,229,.11), transparent 74%);
  transition: opacity .3s var(--ease);
}
/* Sin pieza encima, la luz no alumbra nada: se ve como una mancha en mitad de
   la pantalla. Baja hasta que haya algo que iluminar. */
.stage:has(.blank)::before { opacity: .38; }

#frame {
  position: relative; height: 100%; aspect-ratio: 1; max-width: 100%;
  overflow: hidden; border-radius: var(--r4); background: #000;
  cursor: grab; touch-action: none; user-select: none; box-shadow: var(--lift);
}
#frame.dragging { cursor: grabbing; }
#photo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

/* Guides: where the title and the data card land. Not the render. */
.guide {
  position: absolute; border: 1px dashed rgba(255,255,255,.42);
  background: rgba(8,5,16,.34); border-radius: 6px; pointer-events: none;
  display: grid; place-items: center; text-align: center;
  font: 600 11px "Jakarta", sans-serif; letter-spacing: .04em;
  color: rgba(255,255,255,.82);
}
.guide.round { border-radius: 50%; }

.blank {
  position: relative;
  display: grid; align-content: center; justify-items: center; gap: var(--s2);
  height: 100%; aspect-ratio: 1; max-width: 100%;
  border: 1px dashed var(--line); border-radius: var(--r4);
  color: var(--ink-2); text-align: center; padding: var(--s7);
}
.blank b { color: var(--ink); font-size: 15px; font-weight: 700; }
.blank span { font-size: 13px; }

.hint { padding-block-start: var(--s3); color: var(--ink-2); font-size: 13px; text-align: center; }
kbd {
  font: 600 11px "Jakarta", sans-serif; padding: 1px 5px; border-radius: 5px;
  background: var(--raise); border: 1px solid var(--edge); color: var(--ink-2);
  box-shadow: inset 0 1px 0 var(--edge-2);
}

/* ── Result ───────────────────────────────────────────────────────────────── */
/* The four slides take the same square footprint as the frame, so the eye
   does not have to re-settle between framing and reviewing. Slides are 1:1
   and so are the cells, so `cover` crops nothing. */
.result {
  position: relative;
  height: 100%; aspect-ratio: 1; max-width: 100%; min-height: 0;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  /* Aire, no adorno: con --lift la sombra de cada slide mide mas que los 8px
     que las separaban y las cuatro se emborronaban entre si. */
  gap: var(--s3);
}
/* --lift y no --shadow: las cuatro slides son la pieza terminada y merecen la
   misma profundidad que el encuadre del que salieron. Con la sombra corta se
   quedaban pegadas al fondo, que es justo lo que no son. */
.result figure {
  position: relative; min-height: 0; overflow: hidden;
  border-radius: var(--r3); background: var(--raise);
  border: 1px solid var(--edge);
  box-shadow: var(--lift), inset 0 1px 0 var(--edge-2);
  animation: rise .45s var(--ease) both;
}
.result figure:nth-child(2) { animation-delay: .06s; }
.result figure:nth-child(3) { animation-delay: .12s; }
.result figure:nth-child(4) { animation-delay: .18s; }
.result a { display: block; height: 100%; }
.result img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* El pie aparece al apuntar, no antes. Este panel existe para revisar la pieza
   antes de publicarla, y su degradado caia justo sobre la esquina donde el
   render pone el precio: tapaba el dato que se viene a comprobar. En reposo se
   ve el slide entero; el nombre del archivo esta a un puntero de distancia, y
   con el teclado sale solo al enfocar el enlace. */
.result figcaption {
  position: absolute; inset-inline: 0; inset-block-end: 0;
  display: flex; justify-content: space-between; gap: var(--s2);
  padding: var(--s5) var(--s3) 7px;
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,.94);
  background: linear-gradient(to top, rgba(8,5,16,.92), rgba(8,5,16,.4) 55%, transparent);
  opacity: 0; transition: opacity .16s var(--ease);
}
.result figure:hover figcaption,
.result figure:focus-within figcaption { opacity: 1; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px) scale(.98); filter: blur(4px); }
  to   { opacity: 1; transform: none; filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Details ──────────────────────────────────────────────────────────────── */
.fields { display: grid; align-content: start; gap: var(--s3); }
/* minmax(0,…) not 1fr: an <input> has its own min width and `1fr` would push
   the second column out of the rail instead of letting it shrink. */
.fields .pair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--s2); }
.field, .field input { min-width: 0; }
.field label {
  display: block; margin-block-end: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; color: var(--ink-2);
}
.field.empty input { border-color: #4a2740; }

/* ── Wide: spare width goes to the rails, not to the void ─────────────────── */
@media (min-width: 1600px) {
  .board { grid-template-columns: 348px minmax(0, 1fr) 340px; }
  .gallery { grid-template-columns: repeat(3, 1fr); }
}

/* ── Short or narrow: one column, the page scrolls ────────────────────────── */
@media (max-width: 1180px), (max-height: 620px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .board { grid-template-columns: 1fr; }
  .rail.left, .rail.right { border: 0; border-block-start: 1px solid var(--line); }
  .rail-body { overflow: visible; }
  .stage-col { padding: var(--s4); }
  .stage { min-height: 0; }
  #frame, .blank, .result { height: auto; width: min(100%, 68vh); }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .topbar { flex-wrap: wrap; }
  .status { order: 3; flex-basis: 100%; }
  .lookup input { width: 200px; }
}

/* ── Deliver ──────────────────────────────────────────────────────────────── */
/* La linea a la izquierda no es adorno: separa construir de entregar. Sin ella
   habia cinco botones seguidos y ninguno se leia como el importante. */
.deliver {
  display: flex; align-items: center; gap: var(--s2);
  margin-inline-start: auto; padding-inline-start: var(--s5);
  border-inline-start: 1px solid var(--edge);
}

/* Verde, y el unico relleno del grupo: es la unica accion de la pagina que sale
   de la maquina y no se puede deshacer. Descargar vuelve a fantasma —sigue a un
   clic— porque dos botones rellenos lado a lado no son una jerarquia. */
button.go {
  background: linear-gradient(180deg, #6BE7B0, var(--green) 60%, #34B87B);
  border-color: rgba(255,255,255,.2); color: #05251A;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4),
              inset 0 -1px 0 rgba(0,0,0,.16),
              0 8px 22px -12px rgba(74,222,155,.7);
}
button.go:hover:not(:disabled) {
  background: linear-gradient(180deg, #7DF0BC, #55DFA2 60%, #3EC98A);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.48),
              0 10px 26px -12px rgba(74,222,155,.95);
}
/* Un solo cuerpo con una junta de 1px: dos botones separados leerian como dos
   acciones, y es una sola con dos horas. */
.split { display: flex; }
.split > button:first-child { border-start-end-radius: 0; border-end-end-radius: 0; }
.split > button.seg {
  border-start-start-radius: 0; border-end-start-radius: 0;
  border-inline-start: 1px solid rgba(5,37,26,.22);
  padding-inline: 9px;
}
.split > button.seg .icon { width: 14px; height: 14px; }

.sched { position: relative; }
.sched-pop {
  position: absolute; inset-block-start: calc(100% + 10px); inset-inline-end: 0;
  z-index: 6; display: grid; gap: var(--s2); padding: var(--s3);
  border: 1px solid var(--edge-2); border-radius: var(--r3);
  /* Opaco, y no --sheet: con la superficie translucida de la barra se leian
     los titulos del rail por debajo del campo de la fecha. Un panel flotante
     tapa lo que hay detras, o no es un panel. */
  background: #1B142A; box-shadow: var(--lift);
}
.sched-pop label {
  font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-2);
}
.sched-row { display: flex; align-items: center; gap: var(--s2); }
.sched-pop input[type=datetime-local] {
  color-scheme: dark;
  padding: 8px var(--s3); background: var(--raise);
  border: 1px solid var(--edge); border-radius: var(--r4);
  color: var(--ink); font: 500 13px "Jakarta", system-ui, sans-serif;
  box-shadow: inset 0 1px 0 var(--edge), inset 0 8px 18px -14px #000;
}
.sched-pop input[type=datetime-local]:focus {
  border-color: var(--violet); outline: none;
  box-shadow: inset 0 1px 0 var(--edge-2), 0 0 0 3px rgba(132,96,229,.16);
}
/* Un enlace y no un boton: lleva a otra pagina, no hace nada aqui. Pero se
   sienta en la misma fila que los botones ya-pill de .deliver, asi que
   comparte su radio: cuadrado ahi al lado se leia como el unico que no
   encajaba. */
.deliver .agenda {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px var(--s3); border-radius: var(--r-pill);
  font-size: 13px; font-weight: 600; color: var(--ink-2); text-decoration: none;
}
.deliver .agenda:hover { background: var(--raise); color: var(--ink); }
/* Lo que espera su hora se cuenta donde ya se esta mirando: una cola que solo
   se ve entrando a otra pagina no se mira, y un programado vencido no avisa.
   En rojo cuando algo se paso de hora o fallo: el ambar de esta hoja esta
   reservado a la insignia de portada y nada mas. */
/* Era una mancha de 17px con el mismo relleno que un boton en reposo: el unico
   sitio donde la herramienta avisa que algo espera, y el mas facil de no ver.
   Ahora tiene canto propio y cifras tabulares, y el rojo trae su halo — que en
   una insignia de 19px es lo que la separa del texto que la rodea. */
.count {
  min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px;
  display: inline-grid; place-items: center;
  font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  background: var(--raise-2); color: var(--ink);
  border: 1px solid var(--edge-2);
  box-shadow: inset 0 1px 0 var(--edge-2);
}
.count.alert {
  background: var(--red); color: #2A0B08; border-color: rgba(255,255,255,.28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.36), 0 4px 14px -6px rgba(248,113,113,.9);
}

/* Armado: el segundo clic publica. Rojo, que en esta paleta es lo que exige
   mirar antes de seguir, y no el ambar — que esta hoja reserva a la insignia de
   portada. El verde vuelve en cuanto se desarma. */
button.go.armed,
/* El segmento del reloj se arma con el resto: es el mismo cuerpo, y medio boton
   rojo con medio boton verde se lee como dos controles distintos. */
.split:has(button.armed) > button.seg {
  background: linear-gradient(180deg, #FFA9A0, var(--red) 58%, #DC5F52);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 0 0 3px rgba(248,113,113,.24);
  color: #2A0B08;
}
.split:has(button.armed) > button.seg { border-inline-start-color: rgba(42,11,8,.26); }

/* Mientras Instagram procesa: el anillo reemplaza al avion dentro del mismo
   boton. La barra de la topbar dice que la pagina esta ocupada; esto dice cual
   de los botones lo esta, que es lo que se mira mientras se espera. */
.go .spin {
  width: 15px; height: 15px; flex: none; border-radius: 50%;
  border: 2px solid currentColor; border-block-start-color: transparent;
  animation: turn .7s linear infinite;
}
@keyframes turn { to { transform: rotate(1turn); } }
.go.sending .icon { display: none; }

.done {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  font-size: 13px; font-weight: 600; color: var(--green);
  animation: done-in .34s var(--ease) both;
}
/* El check se dibuja en vez de aparecer: es la confirmacion de lo unico que no
   se puede deshacer, y merece el unico momento animado de la barra. */
.done .icon path { stroke-dasharray: 22; animation: done-draw .45s var(--ease) .1s both; }
@keyframes done-in   { from { opacity: 0; transform: translateY(5px); } }
@keyframes done-draw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
.done a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.done a:hover { color: var(--ink); }

.sched-echo {
  font-size: 12px; color: var(--ink-2); max-width: 27ch;
}
.sched-echo.late { color: var(--red); }

.cap-count {
  font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-2);
  margin-inline-start: auto;
}
.cap-count.over { color: var(--red); }
</style>

        <button class="ghost small capgrow" id="capGrow" aria-expanded="false"

<script>
// Real design coordinates, against the 1080×1080 frame.
const GUIDES = [
  { x: 45,     y: 49,     w: 372,    h: 104,    txt: "store" },
  { x: 600,    y: 42,     w: 409.56, h: 188,    txt: "make and model", coverOnly: true },
  { x: 45.19,  y: 515.22, w: 92.386, h: 92.386, txt: "", round: true, from: 1 },
  { x: 942.42, y: 515.22, w: 92.386, h: 92.386, txt: "", round: true, notLast: true },
  { x: 45,     y: 778.25, w: 353,    h: 51,     txt: "date" },
  { x: 45,     y: 845,    w: 466,    h: 176,    txt: "car details" },
  { x: 855.29, y: 952.32, w: 179.51, h: 66.69,  txt: "vmc" },
];
// Keys stay Spanish: they are the datos.json contract the renderer reads.
const FIELDS = [
  ["marca", "Make"], ["modelo", "Model"],
  ["anio", "Year"], ["transmision", "Transmission"],
  ["precio", "Starting price"], ["tienda", "Official store"],
  ["fecha", "Date"], ["hora", "Time"],
];
// Precio y tienda tambien van de a dos: eran las dos ultimas filas a ancho
// completo por dos valores cortos, y esa fila de mas se la come el caption.
const PAIRS = [["marca", "modelo"], ["anio", "transmision"], ["fecha", "hora"],
               ["precio", "tienda"]];

const S = { code: "", photos: [], picked: [], crops: {}, i: 0, slug: null, formato: "gancho" };

const $ = (id) => document.getElementById(id);
const frame = $("frame"), photo = $("photo"), status = $("status");

// Con gancho (portada desenfocada + pregunta de intriga) o clásico (las
// fotos de siempre, sin nada antepuesto). "gancho" es el default.
$("formato").onclick = (e) => {
  const b = e.target.closest("button[data-formato]");
  if (!b) return;
  S.formato = b.dataset.formato;
  $("formato").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
};

const say = (txt, kind = "") => {
  status.textContent = txt; status.title = txt;   // el title salva el mensaje cortado
  status.className = "status " + kind;
};
const busy = (on) => document.body.classList.toggle("busy", on);
const crop = (url) => (S.crops[url] ||= { foco: "50% 50%", escala: 1 });
const pctOf = (s) => s.split(" ").map(parseFloat);
const val = (k) => $("f-" + k).value.trim();

// ── details ─────────────────────────────────────────────────────────────────
{
  const box = (k, label) => {
    const d = document.createElement("div");
    d.className = "field";
    d.innerHTML = `<label for="f-${k}">${label}</label>
                   <input type="text" id="f-${k}" autocomplete="off">`;
    return d;
  };
  const labelOf = (k) => FIELDS.find((f) => f[0] === k)[1];
  const paired = new Set(PAIRS.flat());
  for (const [a, b] of PAIRS) {
    const row = document.createElement("div");
    row.className = "pair";
    row.append(box(a, labelOf(a)), box(b, labelOf(b)));

  }
  for (const [k, label] of FIELDS) if (!paired.has(k)) $("fields").appendChild(box(k, label));
  FIELDS.forEach(([k]) => $("f-" + k).addEventListener("input", review));
}
const fill = (d) => FIELDS.forEach(([k]) => { if (d[k] != null) $("f-" + k).value = d[k]; });

async function ask(route, body) {
  const r = await fetch(route, { method: "POST", body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

// ── the caption ─────────────────────────────────────────────────────────────
// The file on disk is the source of truth, not this textarea: Claude writes
// Posts/<slug>/copy.md from the terminal today and an API will write the same
// file tomorrow. Reload pulls whatever is there; typing here writes it back.
let copyTimer = null;

async function loadCopy() {
  if (!S.slug) return;
  const r = await fetch(`/post/${S.slug}/copy.md?v=${Date.now()}`);
  $("copyText").value = r.ok ? await r.text() : "";
  $("copyState").textContent = r.ok ? "copy.md" : "not written yet";
  contarCaption();
}

function showCopy(on) {
  $("copyHead").hidden = $("copyBody").hidden = !on;
  if (on) loadCopy(); else $("copyText").value = "";
}

$("copyText").oninput = () => {
  $("copyState").textContent = "saving…";
  clearTimeout(copyTimer);
  copyTimer = setTimeout(async () => {
    try {
      await ask("/copy", { slug: S.slug, texto: $("copyText").value });
      $("copyState").textContent = "saved";
    } catch (err) { $("copyState").textContent = "not saved: " + err.message; }
  }, 600);
};

$("copyReload").onclick = loadCopy;

// El caption a rail completo y de vuelta. Es un interruptor y no un modal: se
// sigue viendo el carrusel al lado, que es contra lo que se lee el texto.
$("capGrow").onclick = () => {
  const rail = document.querySelector(".rail.right");
  const abierto = rail.classList.toggle("solo-caption");
  $("capGrow").setAttribute("aria-expanded", abierto ? "true" : "false");
  $("capGrow").title = abierto ? "Bring the car details back"
                               : "Give the caption the whole rail";
};

// Half a minute or so: the skill travels as the system prompt and the caption
// comes back written. It runs on its own once the render lands — a carousel
// with no caption is not the deliverable — and the button is for a second take
// (after ticking Wrecked, or when the hook does not land).
async function draft() {
  if (!S.slug) return;
  $("copyWrite").disabled = true;
  $("copyWrite").textContent = "Writing…";
  $("copyState").textContent = "writing it…";
  try {
    await ask("/generar-copy", { slug: S.slug,
                                siniestrado: $("copyWrecked").checked });
    await loadCopy();
  } catch (err) { $("copyState").textContent = "could not draft it: " + err.message; }
  $("copyWrite").textContent = "Draft again";
  $("copyWrite").disabled = false;
}

$("copyWrite").onclick = draft;

$("copyCopy").onclick = async () => {
  await navigator.clipboard.writeText($("copyText").value);
  $("copyState").textContent = "copied";
};

// ── 1 · the auction ─────────────────────────────────────────────────────────
$("lookup").onsubmit = async (e) => {
  e.preventDefault();
  const code = $("code").value.trim();
  if (!code) return say("Enter the auction code, or paste its link.", "bad");
  $("fetch").disabled = true; busy(true);
  say("Reading the auction…", "busy");
  // One request scrapes the listing and downloads its photos back to back;
  // with Drive photos that can run several seconds past "Reading the
  // auction…", and a label that doesn't move reads as frozen. This is a
  // guess at when the second phase starts, not a server event.
  const avisoFotos = setTimeout(() => say("Downloading photos…", "busy"), 1200);
  try {
    const j = await ask("/oferta", { codigo: code });
    S.code = j.codigo; S.photos = j.fotos;
    // Nothing preselected: which three go in, and in what order, is the one
    // judgement call the tool must not make on your behalf.
    S.picked = []; S.crops = {};
    S.i = 0; S.slug = null;
    fill(j.datos);
    paintGallery(); paint();
    say(`${j.fotos.length} photos from the listing. Pick 3 — tap order is carousel order.`, "ok");
  } catch (err) { say(err.message, "bad"); }
  clearTimeout(avisoFotos);
  $("fetch").disabled = false; busy(false);
  review();
};

// Back to an empty page. Only the screen is cleared: Materiales/ and Posts/
// keep everything, so a finished carousel is still there to reopen.
function reset() {
  Object.assign(S, { code: "", photos: [], picked: [], crops: {}, i: 0, slug: null });
  FIELDS.forEach(([k]) => ($("f-" + k).value = ""));
  $("code").value = "";
  $("result").hidden = true;
  $("result").innerHTML = "";
  deshacerHecho();
  showCopy(false);
  paintGallery(); paint(); review();
}

$("noCode").onclick = () => {
  reset();
  say("Upload your photos and fill the details in.");
  $("f-marca").focus();
};

// ── 2 · the photos ──────────────────────────────────────────────────────────
// Thumbnails are built once. Rebuilding them on every click restarts each
// <img> download and cancels the one in flight, which leaves half the grid
// hanging on a listing with a dozen photos.
function paintGallery() {
  const g = $("gallery");
  g.innerHTML = "";
  for (const f of S.photos) {
    const d = document.createElement("div");
    d.className = "thumb";
    d.dataset.k = f.url;
    d.tabIndex = 0;
    d.setAttribute("role", "button");
    // Removing works by clicking again. Nothing on screen says so, and a badge
    // that only ever appears is read as permanent.
    d.title = "Click to pick · click again to remove";
    d.innerHTML = `<img src="${f.url}" alt="${f.archivo}">
                   <div class="rank" hidden></div>
                   <div class="cover" hidden>COVER</div>`;
    d.onclick = () => choose(f.url);
    d.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(f.url); } };
    g.appendChild(d);
  }
  $("dropzone").hidden = S.photos.length > 0;
  mark();
}

/** Badges only — never touches the <img> elements. */
function mark() {
  for (const d of document.querySelectorAll(".thumb")) {
    const n = S.picked.indexOf(d.dataset.k);
    d.classList.toggle("picked", n >= 0);
    d.classList.toggle("current", n === S.i && n >= 0);
    d.setAttribute("aria-pressed", n >= 0);
    const rank = d.querySelector(".rank");
    rank.hidden = n < 0;
    rank.textContent = n + 1;
    d.querySelector(".cover").hidden = n !== 0;
  }
}

// A click appends to the order; clicking again removes it.
function choose(url) {
  const n = S.picked.indexOf(url);
  if (n >= 0) S.picked.splice(n, 1);
  else if (S.picked.length < 3) S.picked.push(url);
  else return say("Three already picked. Remove one to swap it.", "bad");
  if (S.i >= S.picked.length) S.i = Math.max(0, S.picked.length - 1);
  paint(); review();
}

$("pick").onclick = () => $("files").click();
$("files").onchange = (e) => { upload([...e.target.files]); e.target.value = ""; };

// The whole rail is a drop target: dragging in from the file manager is the
// fastest way to hand the tool your own shots.
const rail = $("photoRail");
["dragenter", "dragover"].forEach((ev) => rail.addEventListener(ev, (e) => {
  e.preventDefault(); rail.classList.add("dragging");
}));
["dragleave", "drop"].forEach((ev) => rail.addEventListener(ev, (e) => {
  if (ev === "dragleave" && rail.contains(e.relatedTarget)) return;
  rail.classList.remove("dragging");
}));
rail.addEventListener("drop", (e) => {
  e.preventDefault();
  upload([...e.dataTransfer.files].filter((f) => f.type.startsWith("image/")));
});

async function upload(files) {
  if (!files.length) return;
  busy(true);
  say(`Uploading ${files.length} photo${files.length > 1 ? "s" : ""}…`, "busy");
  try {
    for (const f of files) {
      const datos = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result.split(",")[1]);
        fr.onerror = () => rej(new Error(`Could not read ${f.name}`));
        fr.readAsDataURL(f);
      });
      const j = await ask("/subir", { codigo: S.code, nombre: f.name, datos });
      if (!S.photos.some((p) => p.url === j.foto.url)) S.photos.push(j.foto);
    }
    paintGallery(); paint();
    say("Photos uploaded.", "ok");
  } catch (err) { say(err.message, "bad"); }
  busy(false);
  review();
}

// ── 3 · the framing ─────────────────────────────────────────────────────────
function paint() {
  const any = S.picked.length > 0;
  const showingResult = !$("result").hidden;

  $("tabs").innerHTML = "";
  S.picked.forEach((_, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n + 1;
    b.className = n === S.i && !showingResult ? "on" : "";
    b.title = n === 0 ? "Cover" : `Slide ${n + 1}`;
    b.onclick = () => { $("result").hidden = true; S.i = n; paint(); };
    $("tabs").appendChild(b);
  });
  if (S.slug) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "✓";
    b.className = showingResult ? "on" : "";
    b.title = "Back to the generated carousel";
    b.onclick = () => { $("result").hidden = false; paint(); };
    $("tabs").appendChild(b);
  }

  // Once a carousel exists, taking it away is the next move — so it is the one
  // that carries the weight, and generating again (after reframing) steps back.
  // Entregar aparece con los slides a la vista, y no con el slug: un carrusel
  // reabierto tiene archivos en disco pero todavia no se ha mirado, y mover una
  // foto deja el render viejo. Descargar o publicar lo que no esta en pantalla
  // manda al feed la version anterior, y eso no se puede deshacer.
  $("deliver").hidden = !(S.slug && showingResult);
  $("build").classList.toggle("primary", !S.slug);
  $("build").classList.toggle("ghost", !!S.slug);
  // Con un carrusel hecho, el mismo boton vuelve a renderizar. Llamarlo igual
  // que la primera vez esconde que hay trabajo que se repite.
  $("build").textContent = S.slug ? "Regenerate" : "Generate carousel";

  // On the result view the zoom has nothing to act on, so it leaves rather
  // than sitting there offering something that does nothing.
  document.querySelector(".zoombox").hidden = showingResult;
  $("zoom").disabled = !any;
  $("recenter").disabled = !any;
  frame.hidden = !any || showingResult;
  $("blank").hidden = any || showingResult;
  $("hint").hidden = showingResult;
  $("hint").innerHTML = any
    ? 'Drag to move · scroll to zoom · <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> to nudge'
    : "The dashed guides show where the title and the data card land.";

  if (!any || showingResult) return;

  const url = S.picked[S.i], a = crop(url);
  if (photo.getAttribute("src") !== url) {
    photo.src = url;
    photo.alt = (S.photos.find((f) => f.url === url) || {}).archivo || "";
  }
  photo.style.objectPosition = a.foco;
  if (a.escala === 1) { photo.style.transform = ""; photo.style.transformOrigin = ""; }
  else { photo.style.transform = `scale(${a.escala})`; photo.style.transformOrigin = a.foco; }
  $("zoom").value = a.escala;
  $("zoomOut").value = Number(a.escala).toFixed(2) + "×";
  guides();
  mark();
}

function guides() {
  frame.querySelectorAll(".guide").forEach((g) => g.remove());
  const last = S.picked.length - 1;
  for (const g of GUIDES) {
    if (g.coverOnly && S.i !== 0) continue;
    if (g.from !== undefined && S.i < g.from) continue;
    if (g.notLast && S.i >= last) continue;
    const d = document.createElement("div");
    d.className = "guide" + (g.round ? " round" : "");
    d.style.cssText = `left:${g.x / 10.8}%;top:${g.y / 10.8}%;` +
                      `width:${g.w / 10.8}%;height:${g.h / 10.8}%`;
    d.textContent = g.txt;
    frame.appendChild(d);
  }
}

// How far the crop can travel: what the square crop leaves over (a landscape
// photo spills sideways and not at all vertically) plus what the zoom adds.
function travel() {
  const side = frame.clientWidth, w = photo.naturalWidth, h = photo.naturalHeight;
  if (!w || !h) return { x: 0, y: 0 };
  const cover = Math.max(side / w, side / h);
  const extra = side * (crop(S.picked[S.i]).escala - 1);
  return { x: w * cover - side + extra, y: h * cover - side + extra };
}

const clamp = (v) => Math.min(100, Math.max(0, v));
function setFocus(px, py) {
  crop(S.picked[S.i]).foco = clamp(px).toFixed(1) + "% " + clamp(py).toFixed(1) + "%";
  paint();
}

let drag = null;
frame.addEventListener("pointerdown", (e) => {
  if (!S.picked.length) return;
  drag = { x: e.clientX, y: e.clientY, foco: pctOf(crop(S.picked[S.i]).foco), range: travel() };
  frame.setPointerCapture(e.pointerId);
  frame.classList.add("dragging");
});
frame.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const a = crop(S.picked[S.i]);
  const dx = (e.clientX - drag.x) / a.escala;
  const dy = (e.clientY - drag.y) / a.escala;
  setFocus(drag.range.x ? drag.foco[0] - dx / drag.range.x * 100 : drag.foco[0],
           drag.range.y ? drag.foco[1] - dy / drag.range.y * 100 : drag.foco[1]);
});
const release = () => { drag = null; frame.classList.remove("dragging"); };
frame.addEventListener("pointerup", release);
frame.addEventListener("pointercancel", release);

frame.addEventListener("wheel", (e) => {
  if (!S.picked.length) return;
  e.preventDefault();
  const a = crop(S.picked[S.i]);
  a.escala = Math.min(3, Math.max(1, +(a.escala - e.deltaY * 0.0015).toFixed(3)));
  paint();
}, { passive: false });

// Arrow keys nudge the crop: a mouse cannot land on a single percent.
frame.addEventListener("keydown", (e) => {
  if (!S.picked.length) return;
  const step = e.shiftKey ? 5 : 1;
  const [px, py] = pctOf(crop(S.picked[S.i]).foco);
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  const m = moves[e.key];
  if (!m) return;
  e.preventDefault();
  setFocus(px + m[0], py + m[1]);
});

$("zoom").oninput = () => {
  if (!S.picked.length) return;
  crop(S.picked[S.i]).escala = +$("zoom").value;
  paint();
};
$("recenter").onclick = () => {
  S.crops[S.picked[S.i]] = { foco: "50% 50%", escala: 1 };
  paint();
};

// ── 4 · generate ────────────────────────────────────────────────────────────
function review() {
  const missing = FIELDS.filter(([k]) => !val(k));
  FIELDS.forEach(([k]) =>
    $("f-" + k).closest(".field").classList.toggle("empty", !val(k) && S.picked.length > 0));
  $("build").disabled = !S.picked.length || missing.length > 0;
  if (status.classList.contains("bad") || status.classList.contains("busy")) return;
  if (!S.photos.length) say("Start with the auction code, or upload your photos.");
  else if (!S.picked.length) say("Pick the carousel photos.");
  else if (missing.length) say("Still missing: " + missing.map(([, l]) => l.toLowerCase()).join(", "));
  else if (!status.classList.contains("ok")) say("Ready to generate.");
}

$("build").onclick = async () => {
  $("build").disabled = true; busy(true);
  $("build").textContent = "Generating…";
  say("Rendering the carousel…", "busy");
  try {
    const j = await ask("/generar", {
      codigo: S.code,
      formato: S.formato,
      datos: Object.fromEntries(FIELDS.map(([k]) => [k, val(k)])),
      fotos: S.picked.map((url) => {
        const f = S.photos.find((x) => x.url === url);
        return { archivo: f.archivo, carpeta: f.carpeta, ...crop(url) };
      }),
    });
    S.slug = j.slug;
    pintarSlides(j.slides);
    $("result").hidden = false;
    showCopy(true);
    paint();
    // Sin la ruta: en verde y con barras se lee como un enlace, y no lleva a
    // ningun sitio — el navegador no abre una carpeta. Las slides estan en
    // pantalla, y quien quiera los archivos tiene el boton de Download.
    say("Done · check the slides before publishing", "ok");
    draft();   // not awaited: the slides are up, the caption fills in behind

  } catch (err) { say("Could not generate: " + err.message, "bad"); }
  $("build").textContent = S.slug ? "Regenerate" : "Generate carousel";
  $("build").disabled = false; busy(false);
};

// An <a download> and not location.href: a navigation that lands on an error
// would take the whole page's state with it, and this one runs after the work.
$("download").onclick = () => {
  const slug = S.slug;
  const a = document.createElement("a");
  a.href = "/descargar/" + slug;
  a.download = "";                     // the server names it: <slug>.zip
  a.click();
  // Sin reset: bajar el ZIP ya no es el final del camino. Desde que se puede
  // publicar, descargar es una copia mas — y vaciar la pantalla obligaba a
  // rearmar el carrusel entero para publicar lo que ya estaba hecho.
  say(`${slug}.zip downloaded · the carousel stays up`, "ok");
};


// El carrusel hecho, en el panel del resultado. Un solo sitio lo pinta: al
// generar, y al reabrir una subasta terminada — donde antes la pestana del
// carrusel abria una pantalla en negro.
function pintarSlides(urls) {
  $("result").innerHTML = (urls || []).map((u, n) => `
      <figure>
        <a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Slide ${n + 1}"></a>
        <figcaption><span>${n + 1 === urls.length ? "Closing card" : "Slide " + (n + 1)}</span>
        <span>${u.split("/").pop().split("?")[0]}</span></figcaption>
      </figure>`).join("");
}

// El caption del feed sale de una sola seccion del copy: el archivo lleva
// tambien el texto de WhatsApp, y publicar el archivo entero mandaria los
// titulos dentro del post. Mismo criterio que aplica el servidor al publicar,
// aqui solo para poder contar lo que va a salir.
function captionFeed(texto) {
  let dentro = false; const fuera = [];
  for (const l of texto.split("\n")) {
    if (l.startsWith("## ")) { dentro = l.trim().toLowerCase() === "## instagram"; continue; }
    if (dentro) fuera.push(l);
  }
  return (fuera.length || dentro) ? fuera.join("\n").trim() : texto.trim();
}

const TOPE_CAPTION = 2200;   // el de Instagram, no el nuestro

function contarCaption() {
  const n = captionFeed($("copyText").value).length;
  const c = $("capCount");
  c.textContent = `${n} / ${TOPE_CAPTION}`;
  c.title = "Solo la sección ## Instagram se publica";
  c.classList.toggle("over", n > TOPE_CAPTION);
}
$("copyText").addEventListener("input", contarCaption);

// ── publishing ──────────────────────────────────────────────────────────────
// Publish and Schedule go to the same endpoint: the only difference is whether
// a time travels with the request. One path, one queue, one page to look at.
async function send(cuando) {
  const slug = S.slug;
  if (!slug) return;
  const botones = [$("publishNow"), $("publishLater")];
  botones.forEach(b => b.disabled = true);
  $("publishNow").classList.add("sending");
  $("publishSpin").hidden = false;
  busy(true);

  // El contador no es adorno: Instagram procesa cada imagen del carrusel antes
  // de dejar publicarlo, asi que esto tarda entre veinte y cuarenta segundos.
  // Un rotulo fijo tanto rato se lee como colgado, y el reflejo es volver a
  // hacer clic en lo unico que no se puede deshacer.
  const t0 = Date.now();
  const verbo = cuando ? "Scheduling" : "Publishing to Instagram";
  $("publishLabel").textContent = cuando ? "Scheduling…" : "Publishing…";
  const tic = () => say(`${verbo}… ${Math.round((Date.now() - t0) / 1000)}s`, "busy");
  tic();
  const cuenta = setInterval(tic, 1000);

  try {
    const r = await fetch("/publicar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug, texto: $("copyText").value, cuando }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "unknown");
    clearInterval(cuenta);
    hecho(j);
    say(j.estado === "publicado" ? `Published · ${slug}` : `Scheduled · ${slug}`, "ok");
  } catch (err) {
    clearInterval(cuenta);
    say("Could not publish: " + err.message, "bad");
  } finally {
    clearInterval(cuenta);
    busy(false);
    $("publishNow").classList.remove("sending");
    $("publishSpin").hidden = true;
    botones.forEach(b => b.disabled = false);
    desarmar();          // devuelve el rotulo, y deja el boton sin armar
  }
  contar();
}

// Lo que salio se queda dicho, con su enlace, en el sitio donde estaban los
// botones. Antes esto llamaba a reset(): la pantalla se vaciaba justo cuando
// habia algo que confirmar, y el aviso vivia en una linea que el mensaje
// siguiente pisaba.
function hecho(j) {
  const publicado = j.estado === "publicado";
  $("doneText").textContent = publicado ? "Published" : `Scheduled for ${j.cuando}`;
  $("doneLink").hidden = !j.permalink;
  if (j.permalink) $("doneLink").href = j.permalink;
  $("done").hidden = false;
  // Publicado esconde el boton: el segundo clic seria un post duplicado en el
  // feed. Programado no, porque cambiar de hora es normal y volver a programar
  // reemplaza la fila anterior en vez de sumar otra. Descargar se queda en los
  // dos casos: el ZIP sigue sirviendo despues de publicar.
  document.querySelector(".sched").hidden = publicado;
  desarmar();
}

function deshacerHecho() {
  $("done").hidden = true;
  document.querySelector(".sched").hidden = false;
  desarmar();
}

// Publicar pide dos clics. No es un modal —no hace falta interrumpir para algo
// que se decide en un segundo— pero un clic suelto en un boton verde manda un
// post al feed de la marca y eso no tiene vuelta atras. El segundo clic vive
// cuatro segundos: pasado ese rato el boton se desarma solo, porque un boton que
// se queda armado es el mismo clic accidental una pantalla mas tarde.
let armado = 0, reloj = null;

function desarmar() {
  armado = 0; clearTimeout(reloj);
  $("publishNow").classList.remove("armed");
  $("publishLabel").textContent = "Publish now";
}

$("publishNow").onclick = () => {
  if (armado && Date.now() - armado < 4000) { desarmar(); return send(null); }
  armado = Date.now();
  $("publishNow").classList.add("armed");
  $("publishLabel").textContent = "Confirm · publish";
  say("Real post to @vmcsubastas · click again", "busy");
  reloj = setTimeout(() => { desarmar(); say("Publishing cancelled · nothing went out."); }, 4000);
};

// El reloj abre la hora. Se cierra al elegir, al publicar, o con Escape.
const sched = abrir => {
  $("schedPop").hidden = !abrir;
  $("schedToggle").setAttribute("aria-expanded", abrir ? "true" : "false");
  if (!abrir) return;
  // Llega con hora puesta: la siguiente media en punto. Un campo de fecha vacio
  // obliga a teclear ocho numeros para algo que casi siempre es "dentro de un
  // rato", y de paso ensena el formato que espera el navegador.
  if (!$("publishAt").value) {
    const t = new Date(Math.ceil((Date.now() + 6e5) / 18e5) * 18e5);
    const p = n => String(n).padStart(2, "0");
    $("publishAt").value = `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`
                         + `T${p(t.getHours())}:${p(t.getMinutes())}`;
  }
  ecoHora();
  $("publishAt").focus();
};
$("schedToggle").onclick = () => sched($("schedPop").hidden);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("schedPop").hidden) { sched(false); $("schedToggle").focus(); }
});
// Un panel abierto que no se cierra al mirar a otro lado queda tapando la barra.
document.addEventListener("pointerdown", e => {
  if (!$("schedPop").hidden && !e.target.closest(".sched")) sched(false);
});

function ecoHora() {
  const v = $("publishAt").value, e = $("schedEcho");
  if (!v) { e.textContent = ""; e.className = "sched-echo"; return; }
  const t = new Date(v), pasada = t.getTime() < Date.now();
  e.textContent = (pasada ? "Ya pasó · " : "") + t.toLocaleString("es-PE", {
    weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" });
  e.className = "sched-echo" + (pasada ? " late" : "");
}
$("publishAt").addEventListener("input", ecoHora);

// Cuantas esperan, y si alguna se paso de hora sin que nadie la publicara.
async function contar() {
  try {
    const c = await (await fetch("/cuenta")).json();
    const n = c.esperando + c.fallidos;
    const b = $("agendaCount");
    b.hidden = !n;
    b.textContent = String(n);
    b.classList.toggle("alert", !!(c.atrasados || c.fallidos));
    $("agenda").title = c.atrasados
      ? `${c.atrasados} pasaron su hora y nadie las publicó — revisa el cron`
      : c.fallidos ? `${c.fallidos} fallaron al publicar`
      : n ? `${n} esperando su hora` : "Published and scheduled posts";
  } catch { /* la agenda es informativa: si no responde, no estorba */ }
}
contar();

$("publishLater").onclick = () => {
  const v = $("publishAt").value;
  if (!v) return say("Pick a date and time first", "bad");
  const t = new Date(v).getTime() / 1000;   // el navegador resuelve la zona horaria
  if (t < Date.now() / 1000) return say("That time already passed", "bad");
  sched(false);
  send(t);
};

// Un enlace disfrazado de boton: `.ghost` esta escrito para <button>, y
// duplicar el estilo para un <a> seria una tercera copia de lo mismo.
$("browse").onclick = () => { location.href = "/"; };

// ── reopening a finished carousel, or arriving from the list ────────────────
(async () => {
  const j = await (await fetch("/inicio")).json();
  if (!j.slug) {
    // La lista de ofertas enlaza aqui con ?oferta=<codigo>. Se limpia la URL
    // antes de buscar —recargar no puede volver a disparar la descarga— pero
    // se queda en /estudio: recargar tiene que dejarte donde estabas, y "/"
    // es la lista.
    const elegida = new URLSearchParams(location.search).get("oferta");
    if (/^\d+$/.test(elegida || "")) {
      $("code").value = elegida;
      history.replaceState(null, "", "/estudio");
      $("lookup").requestSubmit();          // el propio manejador pinta
      return;
    }
    paintGallery(); paint(); review(); return;
  }
  S.code = j.codigo; S.photos = j.fotos;
  S.picked = j.elegidas; S.crops = j.ajustes; S.slug = j.slug;
  fill(j.datos);
  pintarSlides(j.slides);
  paintGallery(); paint(); review(); showCopy(true);
  say(`${j.slug} · reframe it and generate again`, "ok");
})();
</script>
