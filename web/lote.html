<!-- La barra: aparece con la primera elegida y dispara el lote. Se queda
     abajo mientras la tanda corre, con el paso y el camino de vuelta al
     modal: cerrarlo no puede costar los resultados. -->
<div class=barra id=barra hidden>
 <b id=cuenta></b>
 <span class=paso id=paso></span>
 <div class=fmt-toggle id=fmtLote role=group aria-label="Formato del carrusel">
  <button type=button class=on data-formato=gancho>Con gancho</button>
  <button type=button data-formato=clasico>Normal</button>
 </div>
 <button class=pill-ghost type=button id=limpiar>Quitar la selección</button>
 <button class=pill-ver type=button id=ver hidden>Ver los carruseles</button>
 <button class=pill-primary type=button id=hacer>Hacer los carruseles</button>
</div>

<!-- El modal de la tanda. Los bloques se crean todos al empezar, en el orden
     de la pantalla y ya con su nombre y su foto: quien marco tres subastas
     tiene que ver tres desde el primer segundo, no verlas aparecer de a una y
     desordenadas. Cada uno se rellena cuando su render termina. -->
<div class=capa id=capa hidden role=dialog aria-modal=true aria-labelledby=cabTexto>
 <div class=modal>

   <header class=cabecera>
     <div class=cab-icono id=cabIcono></div>
     <div class=cab-medio>
       <p class=cab-texto id=cabTexto>Haciendo los carruseles…</p>
       <div class=pista id=pista><div class=pista-fill id=pistaFill></div></div>
     </div>
     <b class=cab-cuenta id=cabCuenta></b>
     <div class=cab-acciones id=cabAcciones hidden>
       <a class=pill-primary id=zipBtn download>Descargar el ZIP</a>
       <button class=pill-publicar id=pubTodas type=button disabled>Publicar</button>
     </div>
     <button class=cerrar id=cerrar type=button aria-label=Cerrar></button>
   </header>

   <div class=lista id=lista></div>

 </div>
</div>

<!-- Modal de edición rápida / ajuste de encuadre -->
<div class="capa-editor" id="capaEditor" hidden role="dialog" aria-modal="true" aria-labelledby="editorTitulo">
  <div class="modal-editor">
    <header class="editor-cab">
      <div>
        <h3 class="editor-tit" id="editorTitulo">Ajustar encuadre de la foto</h3>
        <p class="editor-sub" id="editorSub">Arrastra para mover la imagen · usa la rueda o el deslizador para zoom</p>
      </div>
      <button class="cerrar" id="editorCerrar" type="button" aria-label="Cerrar edición"></button>
    </header>

    <div class="editor-cuerpo">
      <div class="editor-stage">
        <div class="editor-frame" id="editorFrame" tabindex="0">
          <img id="editorImg" src="" alt="Encuadre">
        </div>
      </div>
      <div class="editor-controles">
        <div class="editor-zoom-box">
          <label for="editorZoom">Zoom</label>
          <input type="range" id="editorZoom" min="1" max="3" step="0.02" value="1">
          <output id="editorZoomOut">1.00×</output>
          <button class="pill-ghost editor-btn-sm" id="editorRecenter" type="button" title="Centrar y resetear zoom">Recentrar</button>
        </div>
        <div class="editor-galeria" id="editorGaleria" hidden>
          <span class="editor-galeria-tit">Usar otra foto</span>
          <div class="editor-galeria-tira" id="editorGaleriaTira"></div>
        </div>
      </div>
    </div>

    <footer class="editor-pie">
      <p class="editor-msg" id="editorMsg" role="status"></p>
      <button class="pill-ghost" id="editorCancelar" type="button">Cancelar</button>
      <button class="pill-primary" id="editorGuardar" type="button">Guardar y re-renderizar</button>
    </footer>
  </div>
</div>
